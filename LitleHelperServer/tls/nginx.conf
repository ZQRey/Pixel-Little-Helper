map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name helper.gp1.loc;
    ssl_certificate /etc/helper-tls/fullchain.pem;
    ssl_certificate_key /etc/helper-tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 210m;
    # Docker can assign a new address when the application container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    location / {
        set $helper_backend server:5000;
        proxy_pass http://$helper_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
