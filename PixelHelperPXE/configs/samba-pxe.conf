# ==============================================================================
# /etc/samba/smb.conf
# Anonymous Read-Only Share for Windows Network Installation
# ==============================================================================

[global]
   workgroup = WORKGROUP
   server string = PXE Network Boot Server
   security = user
   map to guest = Bad User
   guest account = nobody
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   dns proxy = no

   # Enforce modern SMB dialect for Windows 10/11 compatibility & high performance
   server min protocol = SMB2_02
   server max protocol = SMB3_11
   ea support = no
   store dos attributes = no

# ------------------------------------------------------------------------------
# Windows ISO Unpacked Source Directory
# ------------------------------------------------------------------------------
[install]
   comment = Windows Unpacked Installation Media
   path = /srv/www/pxe/os/windows/iso_extracted
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   create mask = 0644
   directory mask = 0755

