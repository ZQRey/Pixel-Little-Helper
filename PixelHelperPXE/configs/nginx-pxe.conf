# ==============================================================================
# /etc/nginx/sites-available/pxe
# High-Performance HTTP Engine for PXE Network Booting & OS Media
# ==============================================================================

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /srv/www/pxe;
    index index.html index.htm;

    access_log /var/log/nginx/pxe_access.log;
    error_log  /var/log/nginx/pxe_error.log warn;

    # Performance optimizations for large OS media, initrds, and squashfs images
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Extended timeouts for slow network clients or large WinPE / ISO transfers
    # Disable keepalive for single-threaded PXE/GRUB clients to prevent socket exhaustion and LAST-ACK hangs
    keepalive_timeout 0;
    lingering_close off;
    reset_timedout_and_lingering_close on;
    send_timeout 60s;
    client_header_timeout 30s;
    client_body_timeout 30s;

    # Optimal buffering for Multi-Gigabyte file transfers
    output_buffers 4 1m;
    sendfile_max_chunk 2m;

    # Directory browsing for easy inspection of available distributions
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
        try_files $uri $uri/ =404;
    }

    # Enhanced caching and byte range support for disk images & kernels
    location ~* \.(iso|wim|squashfs|img|dat|vmlinuz)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        max_ranges 512;
    }

    # Configuration files (grub.cfg, preseed, kickstart) should never be stale
    location ~* \.(cfg|conf|seed|preseed)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse proxy to PXE Web Control Panel
    location /panel/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

