# ==============================================================================
# /etc/dnsmasq.d/pxe.conf
# Production Dnsmasq Configuration: DHCP Proxy + High-Performance TFTP
# ==============================================================================

# Disable internal DNS server to prevent conflicts with local DNS resolvers
port=0

# Network interface to listen on
interface=SERVER_IFACE_PLACEHOLDER
bind-interfaces

# ------------------------------------------------------------------------------
# DHCP PROXY CONFIGURATION
# ------------------------------------------------------------------------------
# Proxy mode: snoops DHCPDISCOVER broadcasts and provides PXE boot options
# without interfering with leases/IPs from the primary DHCP (MikroTik / Windows AD)
dhcp-range=SERVER_NETWORK_PLACEHOLDER,proxy,SUBNET_MASK_PLACEHOLDER

# Client architecture detection via DHCP Option 93 (client-arch / client-system)
# RFC 4578 & IANA DHCP Architecture types:
#  0 = Intel x86PC (Legacy BIOS)
#  6 = x86 EFI (32-bit UEFI)
#  7 = x64 EFI (64-bit UEFI)
#  9 = EFI ByteCode (x64 UEFI alternative)
# 11 = ARM 64-bit EFI
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi32,option:client-arch,6
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:arm64,option:client-arch,11

# Network Boot File Assignment based on Client Architecture
# Syntax: dhcp-boot=tag:<TAG>,<BOOT_FILE>,<SERVER_NAME>,<SERVER_IP>
dhcp-boot=tag:bios,lpxelinux.0,SERVER_IP_PLACEHOLDER,SERVER_IP_PLACEHOLDER
dhcp-boot=tag:efi64,debian-installer/amd64/bootnetx64.efi,SERVER_IP_PLACEHOLDER,SERVER_IP_PLACEHOLDER

# PXE Menu and Prompt definitions for Intel PXE Specification / ProxyDHCP (Port 4011)
pxe-prompt="Network Boot (PXE)",0
pxe-service=tag:bios,x86PC,"Legacy BIOS Boot (Syslinux)",lpxelinux.0
pxe-service=tag:efi64,x86-64_EFI,"UEFI x64 Secure Boot (Shim/GRUB)",debian-installer/amd64/bootnetx64.efi
pxe-service=tag:efi64,BC_EFI,"UEFI x64 Alternative (Shim/GRUB)",debian-installer/amd64/bootnetx64.efi

# ------------------------------------------------------------------------------
# TFTP ENGINE CONFIGURATION
# ------------------------------------------------------------------------------
# Enable built-in TFTP server
enable-tftp
tftp-root=TFTP_ROOT_PLACEHOLDER

# Convert requested filenames to lowercase for cross-compatibility (e.g. BCD vs bcd)
tftp-lowercase

# Maximum number of concurrent TFTP connections
tftp-max=100

# Logging for troubleshooting (parsed by Web Panel)
log-dhcp
log-queries
log-facility=-
