<!doctype html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>PixelHelper · Мессенджер</title><link rel="icon" type="image/png" href="/messenger/app-icon.png"><link rel="stylesheet" href="/messenger/messenger.css"><script src="/messenger/messenger.js" defer></script></head>
<body>
<section id="login" class="login glass"><div class="brand">P<span>H</span></div><h1>PixelHelper</h1><p>Ваши коллеги — на связи</p><button id="sso" class="primary">Войти под пользователем Windows</button><form id="login-form"><label>Учётная запись AD<input name="username" autocomplete="username" required placeholder="Логин AD"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="secondary">Войти через AD</button></form><p id="login-error" role="alert"></p></section>
<main id="app" hidden>
<nav class="dock glass" aria-label="Навигация"><button id="me" class="avatar" title="Текущий пользователь"></button><div class="nav-items"><button data-filter="all" class="selected" title="Все чаты">☷</button><button data-filter="personal" title="Личные чаты">♙</button><button data-filter="groups" title="Рабочие группы">♟</button><button data-filter="unread" title="Непрочитанные">◉</button><button data-filter="favourite" title="Избранное">☆</button></div><button id="broadcast" title="Массовая рассылка" aria-label="Массовая рассылка">📣</button><button id="theme" title="Переключить тему">◐</button><button id="settings" title="Настройки">⚙</button></nav>
<aside class="dialogs glass"><header><strong>Сообщения</strong><button id="new-group" title="Создать группу">＋</button></header><div class="search"><span>⌕</span><input id="search" placeholder="Поиск сотрудников и групп" aria-label="Поиск"><button id="clear-search" title="Очистить поиск">×</button></div><div class="filters"><button data-filter="all" class="selected">Все</button><button data-filter="unread">Непрочитанные</button><button data-filter="groups">Работа</button><button data-filter="personal">Личные</button></div><div id="contacts" role="list" aria-label="Диалоги"></div><footer id="connection" role="status">Подключение…</footer></aside>
<section class="conversation"><header id="chat-header" class="glass"><button id="back" title="Назад">‹</button><div id="chat-avatar" class="avatar"></div><div class="identity"><strong id="chat-title">Выберите диалог</strong><small id="chat-status">Сообщения, файлы и рабочие группы</small></div><button id="chat-search" title="Поиск по переписке">⌕</button><button id="info" title="Информация о чате">ⓘ</button></header><div id="feed" aria-live="polite"><div class="empty"><div class="brand">P<span>H</span></div><h2>Начните разговор</h2><p>Выберите коллегу или рабочую группу слева</p></div></div><button id="new-messages" hidden>Новые сообщения ↓</button><section class="composer glass"><div id="pending-files"></div><div class="composer-row"><button id="attach" title="Прикрепить файлы">＋</button><input id="file-input" type="file" multiple hidden><textarea id="input" placeholder="Написать сообщение…" rows="1" maxlength="4000" aria-label="Сообщение"></textarea><button id="emoji" title="Emoji помощника">☺</button><button id="send" class="primary" title="Отправить">➤</button></div><div id="emoji-picker" hidden></div><small id="error" role="alert"></small></section></section>
<aside id="drawer" class="glass" hidden><header><strong>Информация</strong><button id="close-info" title="Закрыть">×</button></header><div id="profile"></div></aside>
</main>
<dialog id="modal"><header><strong id="modal-title"></strong><button id="close-modal" title="Закрыть">×</button></header><div id="modal-body"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
