services:
  dnsmasq:
    build:
      context: .
      dockerfile: docker/dnsmasq/Dockerfile
    container_name: pxe-dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CAP_NET_BIND_SERVICE
    volumes:
      - /srv/tftp:/srv/tftp:ro
      - ./configs/dnsmasq-pxe.conf:/etc/dnsmasq.d/pxe.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pxe-nginx
    network_mode: host
    volumes:
      - /srv/www/pxe:/srv/www/pxe:ro
      - ./configs/nginx-pxe.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx:/var/log/nginx
    restart: unless-stopped

  samba:
    build:
      context: .
      dockerfile: docker/samba/Dockerfile
    container_name: pxe-samba
    network_mode: host
    volumes:
      - /srv/www/pxe/os/windows/iso_extracted:/srv/www/pxe/os/windows/iso_extracted:ro
      - ./configs/samba-pxe.conf:/etc/samba/smb.conf:ro
      - /var/log/samba:/var/log/samba
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: docker/panel/Dockerfile
    container_name: pxe-panel
    network_mode: host
    environment:
      - SERVER_IP=172.16.16.61
      - TFTP_ROOT=/srv/tftp
      - WEB_ROOT=/srv/www/pxe
      - CONFIGS_DIR=/opt/pxe-panel/configs
      - SCRIPTS_DIR=/opt/pxe-panel/scripts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /proc/meminfo:/proc/meminfo:ro
      - ./panel/app:/opt/pxe-panel/app
      - ./configs:/opt/pxe-panel/configs:ro
      - ./scripts:/opt/pxe-panel/scripts:ro
      - /srv/tftp:/srv/tftp
      - /srv/www/pxe:/srv/www/pxe
      - /var/log/nginx:/var/log/nginx:ro
    restart: unless-stopped
    depends_on:
      - dnsmasq
      - nginx
      - samba
