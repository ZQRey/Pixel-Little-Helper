<!doctype html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>PixelHelper · Мессенджер</title><link rel="icon" type="image/png" href="/messenger/app-icon.png"><link rel="stylesheet" href="/messenger/messenger.css?v=1.2.67"><script src="/messenger/media-access.js?v=media-fix-1"></script><script src="/messenger/message-formatting.js?v=1.2.67" defer></script><script src="/messenger/messenger.js?v=1.2.67" defer></script></head>
<body>
<section id="login" class="login glass"><div class="brand">P<span>H</span></div><h1>PixelHelper</h1><p>Ваши коллеги — на связи</p><button id="sso" class="primary">Войти под пользователем Windows</button><form id="login-form"><label>Учётная запись AD<input name="username" autocomplete="username" required placeholder="Логин AD"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="secondary">Войти через AD</button></form><button id="login-lang" type="button" class="secondary" style="margin-top:0.75rem;padding:0.45rem 0.9rem;font-size:0.85rem;align-self:center;">🌐 Язык / Тіл / Language</button><p id="login-error" role="alert"></p></section>
<main id="app" hidden>
<nav class="dock glass" aria-label="Навигация"><button id="me" class="avatar" title="Текущий пользователь"></button><div class="nav-items"><button data-filter="all" class="selected" title="Все чаты">☷</button><button data-filter="personal" title="Личные чаты">♙</button><button data-filter="groups" title="Рабочие группы">♟</button><button data-filter="unread" title="Непрочитанные">◉</button><button data-filter="favourite" title="Избранное">☆</button></div><button id="broadcast" title="Массовая рассылка" aria-label="Массовая рассылка">📣</button><button id="lang" title="Язык интерфейса / Тіл / Language / 语言">🌐</button><button id="theme" title="Переключить тему">◐</button><button id="settings" title="Настройки">⚙</button></nav>
<aside class="dialogs glass"><header><strong>Сообщения</strong><button id="new-group" title="Создать группу">＋</button></header><div class="search"><span>⌕</span><input id="search" placeholder="Поиск сотрудников и групп" aria-label="Поиск"><button id="clear-search" title="Очистить поиск">×</button></div><div class="filters"><button data-filter="all" class="selected">Все</button><button data-filter="unread">Непрочитанные</button><button data-filter="groups">Работа</button><button data-filter="personal">Личные</button></div><div id="contacts" role="list" aria-label="Диалоги"></div><footer id="connection" role="status">Подключение…</footer></aside>
<section class="conversation"><header id="chat-header" class="glass"><button id="back" title="Назад">‹</button><div id="chat-avatar" class="avatar"></div><div class="identity"><strong id="chat-title">Выберите диалог</strong><small id="chat-status">Сообщения, файлы и рабочие группы</small></div><button id="call-audio" title="Аудиозвонок" aria-label="Аудиозвонок">📞</button><button id="call-video" title="Видеозвонок" aria-label="Видеозвонок">🎥</button><button id="chat-search" title="Поиск по переписке">⌕</button><button id="info" title="Информация о чате">ⓘ</button></header><div id="group-call-banner" class="group-call-banner" hidden><div class="group-call-info"><span class="group-call-pulse">🟢</span><span id="group-call-text">Идёт групповой звонок</span></div><button id="group-call-join-btn" class="primary">Присоединиться</button></div><div id="feed" aria-live="polite"><div class="empty"><div class="brand">P<span>H</span></div><h2>Начните разговор</h2><p>Выберите коллегу или рабочую группу слева</p></div></div><button id="new-messages" hidden>Новые сообщения ↓</button><section class="composer glass"><div id="pending-files"></div><div id="video-preview-card" class="video-preview-card" hidden><video id="video-recorder-preview" autoplay playsinline muted></video><div class="video-preview-controls"><span id="video-recording-timer">00:00</span><button id="video-recording-cancel" class="recording-btn cancel" title="Отменить">✕</button><button id="video-recording-send" class="recording-btn send" title="Отправить">✓</button></div></div><div id="recording-bar" class="recording-bar" hidden><span class="recording-dot"></span><span id="recording-timer">00:00</span><span class="recording-label">Запись голосового…</span><button id="recording-cancel" class="recording-btn cancel" title="Отменить">✕</button><button id="recording-send" class="recording-btn send" title="Отправить">✓</button></div><div class="composer-row"><button id="attach" title="Прикрепить файлы">＋</button><input id="file-input" type="file" multiple hidden><textarea id="input" placeholder="Написать сообщение…" rows="1" maxlength="4000" aria-label="Сообщение"></textarea><button id="record-voice" title="Голосовое сообщение">🎙️</button><button id="record-video" title="Видеосообщение">📹</button><button id="emoji" title="Emoji помощника">☺</button><button id="send" class="primary" title="Отправить">➤</button></div><div id="emoji-picker" hidden></div><small id="error" role="alert"></small></section></section>
<aside id="drawer" class="glass" hidden><header><strong>Информация</strong><button id="close-info" title="Закрыть">×</button></header><div id="profile"></div></aside>
</main>
<dialog id="modal"><header><strong id="modal-title"></strong><button id="close-modal" title="Закрыть">×</button></header><div id="modal-body"></div></dialog>
<dialog id="call-modal" class="call-modal"><div id="call-container" class="call-container"><div id="call-status-bar" class="call-status-bar"><strong id="call-remote-name">Звонок</strong><span id="web-record-indicator" class="record-badge" hidden><span class="record-pulse"></span><span id="web-record-timer">REC 00:00</span></span><span id="call-timer">00:00</span></div><div class="video-grid"><video id="remote-video" autoplay playsinline></video><video id="local-video" autoplay playsinline muted class="pip"></video></div><div class="call-controls"><button id="call-toggle-mic" class="call-btn" title="Микрофон">🎤</button><button id="call-toggle-cam" class="call-btn" title="Камера">📷</button><button id="call-toggle-screen" class="call-btn" title="Демонстрация экрана">🖥️</button><button id="call-record" class="call-btn record" title="Запись видеозвонка" hidden>⏺️</button><button id="call-hangup" class="call-btn hangup" title="Завершить звонок">📞✕</button></div></div></dialog>
<div id="incoming-call-banner" class="incoming-call-banner" hidden><div class="caller-info"><strong id="incoming-caller-name">Входящий звонок…</strong><span id="incoming-call-type">Аудиозвонок</span></div><div class="incoming-actions"><button id="incoming-accept" class="call-btn accept" title="Ответить">📞✓</button><button id="incoming-reject" class="call-btn hangup" title="Отклонить">📞✕</button></div></div>
<div id="toast" role="status" hidden></div>
</body></html>
