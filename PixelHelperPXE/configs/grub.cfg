# ==============================================================================
# /srv/tftp/grub/grub.cfg and /srv/www/pxe/grub/grub.cfg
# Unified Network GRUB Menu for UEFI x64 (Secure Boot & Non-Secure Boot)
# ==============================================================================

set timeout=10
set default=0

# Load essential network and filesystem modules
insmod net
insmod efinet
insmod tftp
insmod http
insmod test
insmod efi_gop
insmod font

# Server IP placeholder (replaced during deployment or detected dynamically)
set server_ip="SERVER_IP_PLACEHOLDER"
set http_base="http://${server_ip}"

# Color settings
set color_normal=light-gray/black
set color_highlight=white/blue

# Header / Title
menuentry "==================================================================" { true }
menuentry "           AUTONOMOUS PRODUCTION PXE BOOT MENU (UEFI)              " { true }
menuentry "==================================================================" { true }

# ------------------------------------------------------------------------------
# 1. Debian GNU/Linux Installation
# ------------------------------------------------------------------------------
submenu "--> Debian GNU/Linux Installer" --class debian {
    menuentry "Debian 12 / 13 Netinstall (Interactive)" --class debian {
        echo "Loading Debian Linux kernel via HTTP..."
        linux (http,${server_ip})/os/debian/linux vga=788 auto=false priority=low --- quiet
        echo "Loading Debian initrd via HTTP..."
        initrd (http,${server_ip})/os/debian/initrd.gz
        echo "Booting installer..."
    }

    menuentry "Debian 12 / 13 Automated Install (Preseed)" --class debian {
        echo "Loading Debian Linux kernel with Preseed URL..."
        linux (http,${server_ip})/os/debian/linux auto=true priority=critical preseed/url=${http_base}/os/debian/preseed.cfg --- quiet
        echo "Loading Debian initrd..."
        initrd (http,${server_ip})/os/debian/initrd.gz
        echo "Booting automated installer..."
    }

    menuentry "Debian Rescue Mode" --class debian {
        linux (http,${server_ip})/os/debian/linux rescue/enable=true vga=788 --- quiet
        initrd (http,${server_ip})/os/debian/initrd.gz
    }
}

# ------------------------------------------------------------------------------
# 2. SystemRescue LiveCD
# ------------------------------------------------------------------------------
menuentry "SystemRescue (Admin / Recovery Toolkit)" --class gnu-linux {
    echo "Loading SystemRescue kernel via HTTP..."
    linux (http,${server_ip})/os/sysrescue/vmlinuz archisobasedir=sysrescue ip=dhcp sysrescue.http=${http_base}/os/sysrescue/ copytoram
    echo "Loading SystemRescue initramfs..."
    initrd (http,${server_ip})/os/sysrescue/initram.img
    echo "Booting SystemRescue..."
}

# ------------------------------------------------------------------------------
# 3. Clonezilla Live
# ------------------------------------------------------------------------------
menuentry "Clonezilla Live (Disk Imaging / Backup)" --class clonezilla {
    echo "Loading Clonezilla kernel via HTTP..."
    linux (http,${server_ip})/os/clonezilla/vmlinuz boot=live config components union=overlay noswap edd=on nomodeset ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_live_batch="no" net.ifnames=0 nosplash noprompt fetch=${http_base}/os/clonezilla/filesystem.squashfs
    echo "Loading Clonezilla initrd..."
    initrd (http,${server_ip})/os/clonezilla/initrd.img
    echo "Booting Clonezilla..."
}

# ------------------------------------------------------------------------------
# 4. Windows 10 / 11 Network Installation (WinPE via wimboot)
# ------------------------------------------------------------------------------
menuentry "Windows Installer (WinPE via wimboot - HTTP)" --class windows {
    echo "Loading wimboot helper via HTTP..."
    linux (http,${server_ip})/tools/wimboot
    echo "Loading Windows Boot Manager & PE Image (this may take a minute)..."
    initrd \
        newc:bootmgr.efi:(http,${server_ip})/os/windows/bootmgr.efi \
        newc:bcd:(http,${server_ip})/os/windows/boot/bcd \
        newc:boot.sdi:(http,${server_ip})/os/windows/boot/boot.sdi \
        newc:boot.wim:(http,${server_ip})/os/windows/sources/boot.wim
    echo "Booting WinPE..."
}

# ------------------------------------------------------------------------------
# 5. Local Drive Boot (UEFI NVMe / SATA)
# ------------------------------------------------------------------------------
menuentry "Boot from Local Storage (HDD/SSD/NVMe)" --class hdd {
    echo "Locating local UEFI bootloader..."
    insmod chain
    set local_found=false

    for loader in /EFI/Microsoft/Boot/bootmgfw.efi /EFI/debian/grubx64.efi /EFI/ubuntu/grubx64.efi /EFI/BOOT/BOOTX64.EFI; do
        search --no-floppy --file --set=root $loader
        if [ $? -eq 0 ]; then
            echo "Found bootloader on ($root)$loader, chainloading..."
            chainloader ($root)$loader
            set local_found=true
            boot
        fi
    done

    if [ "$local_found" = "false" ]; then
        echo "No standard local EFI bootloaders found. Exiting to firmware..."
        exit
    fi
}

# ------------------------------------------------------------------------------
# Utilities
# ------------------------------------------------------------------------------
menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off System" --class shutdown {
    halt
}

